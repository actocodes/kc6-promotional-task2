[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp_server"
version = "0.1.0"
description = "FastMCP Server: Reflection Tool (Sampling) + Hierarchical CRAG Resource"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "tavily-python>=0.3.0",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[project.scripts]
start-server = "mcp_server.server:main"